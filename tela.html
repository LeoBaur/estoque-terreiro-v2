<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Casa do Pai Chico</title>
    <style>
        :root {
            --cor-fundo: #f4f4f9;
            --cor-texto: #333333;
            --cor-primaria: #8B0000; 
            --cor-card: #ffffff;
            --cor-selecionado: #f8d7da;
            --cor-borda-selecionado: #8B0000;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--cor-fundo); color: var(--cor-texto); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 90vh; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo { max-width: 120px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin-bottom: 10px; }
        .titulo-terreiro { font-size: 24px; font-weight: bold; margin: 0; color: #222; text-transform: uppercase; letter-spacing: 1px;}
        .subtitulo-sistema { font-size: 14px; color: var(--cor-primaria); margin-top: 2px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .container { background: var(--cor-card); padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; box-sizing: border-box; flex-grow: 1; }
        
        label { font-weight: bold; margin-top: 15px; display: block; color: #555; font-size: 13px; text-transform: uppercase; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; margin-top: 8px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; background-color: #fafafa; transition: 0.3s; }
        input:focus { border-color: var(--cor-primaria); outline: none; background-color: #fff; }
        
        .categorias-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-top: 5px; scrollbar-width: none; }
        .categorias-container::-webkit-scrollbar { display: none; }
        .btn-categoria { background-color: #eee; border: none; padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #555; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .btn-categoria.ativo { background-color: var(--cor-primaria); color: white; }

        .produtos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .card-produto { border: 2px solid #eee; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; background: #fff; display: flex; flex-direction: column; justify-content: center; min-height: 70px; }
        .card-produto p { margin: 0; font-size: 14px; font-weight: bold; }
        .card-produto small { color: #888; font-size: 12px; margin-top: 5px; }
        .card-produto.selecionado { border-color: var(--cor-borda-selecionado); background-color: var(--cor-selecionado); transform: scale(0.98); }

        .btn-grande { background-color: var(--cor-primaria); color: white; border: none; padding: 18px; font-size: 16px; font-weight: bold; border-radius: 12px; width: 100%; margin-top: 25px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;}
        .btn-grande:active { transform: scale(0.98); opacity: 0.9; }
        .btn-grande:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #mensagem { margin-top: 15px; text-align: center; font-weight: bold; font-size: 15px; padding: 12px; border-radius: 10px; display: none; }

        /* Estilo do Rodapé do Desenvolvedor */
        .footer { margin-top: 30px; text-align: center; color: #888; font-size: 12px; width: 100%; padding-bottom: 20px; }
        .footer span { color: var(--cor-primaria); font-weight: bold; }
        .logo-dev { max-width: 60px; margin-top: 8px; opacity: 0.8; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo-terreiro.png" alt="Logo Casa do Pai Chico" class="logo">
        <h1 class="titulo-terreiro">Casa do Pai Chico</h1>
        <p class="subtitulo-sistema">Sistema Guardião</p>
    </div>

    <div class="container">
        <label>Sua Credencial (CPF):</label>
        <input type="text" id="userId" placeholder="Apenas números..." onchange="salvarCredencial()" inputmode="numeric">

        <div id="areaEstoque" style="display: none;">
            <label>1. Filtre por Categoria:</label>
            <div class="categorias-container" id="listaCategorias"></div>

            <label>2. Toque no Produto:</label>
            <div class="produtos-grid" id="listaProdutos"></div>

            <label>3. Quantidade a Retirar:</label>
            <input type="number" id="quantidade" value="1" min="1">

            <button class="btn-grande" id="btnConfirmar" onclick="darBaixa()" disabled>SELECIONE UM PRODUTO</button>
        </div>

        <div id="mensagem"></div>
    </div>

    <div class="footer">
        <p>Desenvolvido por <span>Seu Nome / Sua Agência</span></p>
        </div>

    <script>
        const urlBase = 'http://localhost:3000';
        let todosItens = [];
        let itemSelecionadoId = null;

        window.onload = async () => {
            const idSalvo = localStorage.getItem('usuario_terreiro');
            if (idSalvo) {
                document.getElementById('userId').value = idSalvo;
                await carregarProdutos(idSalvo);
            }
        };

        async function salvarCredencial() {
            const id = document.getElementById('userId').value;
            localStorage.setItem('usuario_terreiro', id);
            await carregarProdutos(id);
        }

        async function carregarProdutos(userId) {
            mostrarMensagem("Carregando estoque...", "blue");
            try {
                const resposta = await fetch(`${urlBase}/itens`, { headers: { 'x-usuario-id': userId } });
                
                if (resposta.ok) {
                    todosItens = await resposta.json();
                    document.getElementById('areaEstoque').style.display = 'block';
                    esconderMensagem();
                    montarCategorias();
                    renderizarProdutos('Todos');
                } else {
                    document.getElementById('areaEstoque').style.display = 'none';
                    mostrarMensagem("CPF não cadastrado ou sem permissão.", "red");
                }
            } catch (erro) {
                mostrarMensagem("Erro ao conectar com o servidor.", "red");
            }
        }

        function montarCategorias() {
            const container = document.getElementById('listaCategorias');
            const categorias = ['Todos', ...new Set(todosItens.map(item => item.categoria))];
            
            container.innerHTML = '';
            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `btn-categoria ${cat === 'Todos' ? 'ativo' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    renderizarProdutos(cat);
                };
                container.appendChild(btn);
            });
        }

        function renderizarProdutos(categoriaFiltro) {
            const container = document.getElementById('listaProdutos');
            container.innerHTML = '';
            itemSelecionadoId = null;
            atualizarBotao();

            const itensFiltrados = categoriaFiltro === 'Todos' ? todosItens : todosItens.filter(item => item.categoria === categoriaFiltro);

            if(itensFiltrados.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #888;">Nenhum item nesta categoria.</p>';
                return;
            }

            itensFiltrados.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card-produto';
                card.id = `card-${item.id}`;
                card.innerHTML = `<p>${item.nome}</p><small>Disponível: ${item.quantidadeAtual}</small>`;
                card.onclick = () => selecionarItem(item.id);
                container.appendChild(card);
            });
        }

        function selecionarItem(id) {
            itemSelecionadoId = id;
            document.querySelectorAll('.card-produto').forEach(c => c.classList.remove('selecionado'));
            document.getElementById(`card-${id}`).classList.add('selecionado');
            atualizarBotao();
        }

        function atualizarBotao() {
            const btn = document.getElementById('btnConfirmar');
            if (itemSelecionadoId) { btn.disabled = false; btn.innerText = "CONFIRMAR RETIRADA"; } 
            else { btn.disabled = true; btn.innerText = "SELECIONE UM PRODUTO"; }
        }

        async function darBaixa() {
            const userId = document.getElementById('userId').value;
            const quantidade = document.getElementById('quantidade').value;

            if(!itemSelecionadoId || !quantidade || quantidade < 1) { mostrarMensagem("Selecione um item e a quantidade correta.", "red"); return; }
            mostrarMensagem("Processando...", "blue");

            try {
                const resposta = await fetch(`${urlBase}/itens/${itemSelecionadoId}/baixa`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'x-usuario-id': userId },
                    body: JSON.stringify({ quantidadeRetirada: Number(quantidade) })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    let msg = `Sucesso! Restam ${dados.restante} unidades.`;
                    if (dados.alerta) msg += "<br>⚠️ ESTOQUE BAIXO!";
                    mostrarMensagem(msg, "green");
                    await carregarProdutos(userId); 
                } else {
                    mostrarMensagem(`Erro: ${dados.erro}`, "red");
                }
            } catch (erro) {
                mostrarMensagem("Erro de conexão com o servidor.", "red");
            }
        }

        function mostrarMensagem(texto, cor) {
            const div = document.getElementById('mensagem');
            div.style.display = 'block';
            div.innerHTML = texto;
            if(cor === "red") { div.style.backgroundColor = "#ffebee"; div.style.color = "#c62828"; }
            if(cor === "green") { div.style.backgroundColor = "#e8f5e9"; div.style.color = "#2e7d32"; }
            if(cor === "blue") { div.style.backgroundColor = "#e3f2fd"; div.style.color = "#1565c0"; }
        }
        function esconderMensagem() { document.getElementById('mensagem').style.display = 'none'; }
    </script>
</body>
</html>
