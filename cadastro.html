<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Casa do Pai Chico</title>
    <style>
        :root { --cor-fundo: #f4f4f9; --cor-texto: #333333; --cor-admin: #2c3e50; --cor-card: #ffffff; --cor-perigo: #e74c3c; }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--cor-fundo); color: var(--cor-texto); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .logo { max-width: 90px; border-radius: 50%; margin-bottom: 10px; }
        .titulo-terreiro { font-size: 20px; font-weight: bold; margin: 0; color: var(--cor-admin); text-transform: uppercase; }
        .container { background: var(--cor-card); padding: 25px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; box-sizing: border-box; margin-bottom: 20px;}
        
        label { font-weight: bold; margin-top: 15px; display: block; color: #555; font-size: 13px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; background-color: #fafafa; }
        .row { display: flex; gap: 10px; align-items: flex-end; }
        .col { flex: 1; }

        .btn-admin { background-color: var(--cor-admin); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s;}
        .btn-admin:active { transform: scale(0.98); }
        .btn-lixeira { background-color: var(--cor-perigo); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;}
        
        .divisor { height: 2px; background-color: #eee; margin: 25px 0; }
        
        /* Estilo das listas com botão de deletar */
        .lista-gerenciamento { margin-top: 10px; max-height: 150px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 5px; background: #fff;}
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; font-size: 14px;}
        .item-lista:last-child { border-bottom: none; }
        
        #mensagem { text-align: center; font-weight: bold; font-size: 14px; padding: 10px; border-radius: 8px; display: none; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; z-index: 1000;}
    </style>
</head>
<body>

    <div id="mensagem"></div>

    <div class="header">
        <img src="logo-terreiro.png" alt="Logo" class="logo">
        <h1 class="titulo-terreiro">Administração</h1>
    </div>

    <div class="container" style="padding: 15px;">
        <label style="margin-top:0;">Credencial de Admin (CPF):</label>
        <input type="text" id="userId" placeholder="Apenas números..." inputmode="numeric" onchange="carregarTudo()">
    </div>

    <div class="container">
        <h2 style="color: var(--cor-admin); margin-top: 0;">📋 Categorias</h2>
        
        <div class="row">
            <div class="col">
                <input type="text" id="novaCategoria" placeholder="Ex: Ervas, Velas...">
            </div>
            <button class="btn-admin" onclick="cadastrarCategoria()">Criar</button>
        </div>

        <label>Categorias Existentes:</label>
        <div class="lista-gerenciamento" id="listaCategorias">
            <div style="padding:10px; color:#888; text-align:center;">Digite seu CPF primeiro.</div>
        </div>
        
        <div class="divisor"></div>

        <h2 style="color: var(--cor-admin); margin-top: 0;">📦 Produtos</h2>
        
        <label>Selecione a Categoria:</label>
        <select id="selectCategoria">
            <option value="">Aguardando categorias...</option>
        </select>

        <label>Nome do Produto:</label>
        <input type="text" id="nomeProduto" placeholder="Ex: Vela Branca 7 dias">

        <div class="row">
            <div class="col">
                <label>Qtd Inicial:</label>
                <input type="number" id="qtdAtual" value="0" min="0">
            </div>
            <div class="col">
                <label>Estoque Mín.:</label>
                <input type="number" id="estoqueMin" value="5" min="1">
            </div>
        </div>

        <button class="btn-admin" style="width: 100%; margin-top: 15px;" onclick="cadastrarProduto()">Salvar Novo Produto</button>

        <label>Produtos Cadastrados:</label>
        <div class="lista-gerenciamento" id="listaProdutos" style="max-height: 200px;">
            </div>

        <button class="btn-admin" style="background:transparent; color:var(--cor-admin); border:2px solid var(--cor-admin); width: 100%; margin-top: 25px;" onclick="window.location.href='tela.html'">Voltar para Retirada</button>
    </div>

    <script>
        const urlBase = 'http://localhost:3000';

        window.onload = () => {
            const idSalvo = localStorage.getItem('usuario_terreiro');
            if (idSalvo) {
                document.getElementById('userId').value = idSalvo;
                carregarTudo();
            }
        };

        async function carregarTudo() {
            const userId = document.getElementById('userId').value;
            localStorage.setItem('usuario_terreiro', userId);
            await carregarCategorias();
            await carregarProdutos();
        }

        // ==========================
        // LÓGICA DE CATEGORIAS
        // ==========================
        async function carregarCategorias() {
            const userId = document.getElementById('userId').value;
            try {
                const res = await fetch(`${urlBase}/categorias`, { headers: { 'x-usuario-id': userId } });
                if (res.ok) {
                    const categorias = await res.json();
                    
                    // Preenche a lista com botão de lixeira
                    const divLista = document.getElementById('listaCategorias');
                    divLista.innerHTML = '';
                    
                    // Preenche o Select do produto
                    const select = document.getElementById('selectCategoria');
                    select.innerHTML = '<option value="">Selecione...</option>';

                    categorias.forEach(cat => {
                        divLista.innerHTML += `
                            <div class="item-lista">
                                <span>${cat.nome}</span>
                                <button class="btn-lixeira" onclick="deletarCategoria('${cat.id}')">Excluir</button>
                            </div>`;
                        select.innerHTML += `<option value="${cat.nome}">${cat.nome}</option>`;
                    });
                }
            } catch (e) { mostrarAviso("Erro ao carregar categorias", "red"); }
        }

        async function cadastrarCategoria() {
            const userId = document.getElementById('userId').value;
            const nome = document.getElementById('novaCategoria').value;
            if(!nome) return mostrarAviso("Digite um nome para a categoria!", "red");

            const res = await fetch(`${urlBase}/categorias`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-usuario-id': userId },
                body: JSON.stringify({ nome })
            });
            const dados = await res.json();

            if(res.ok) {
                document.getElementById('novaCategoria').value = '';
                mostrarAviso("Categoria criada!", "green");
                carregarCategorias();
            } else {
                mostrarAviso(dados.erro, "red");
            }
        }

        async function deletarCategoria(id) {
            if(!confirm("Tem certeza que deseja excluir esta categoria?")) return;
            const userId = document.getElementById('userId').value;
            await fetch(`${urlBase}/categorias/${id}`, { method: 'DELETE', headers: { 'x-usuario-id': userId } });
            mostrarAviso("Categoria deletada.", "green");
            carregarCategorias();
        }

        // ==========================
        // LÓGICA DE PRODUTOS
        // ==========================
        async function carregarProdutos() {
            const userId = document.getElementById('userId').value;
            try {
                const res = await fetch(`${urlBase}/itens`, { headers: { 'x-usuario-id': userId } });
                if (res.ok) {
                    const produtos = await res.json();
                    const divLista = document.getElementById('listaProdutos');
                    divLista.innerHTML = '';
                    
                    produtos.forEach(prod => {
                        divLista.innerHTML += `
                            <div class="item-lista">
                                <div>
                                    <b>${prod.nome}</b><br>
                                    <small style="color:#888;">${prod.categoria} | Estoque: ${prod.quantidadeAtual}</small>
                                </div>
                                <button class="btn-lixeira" onclick="deletarProduto('${prod.id}')">Excluir</button>
                            </div>`;
                    });
                }
            } catch (e) {}
        }

        async function cadastrarProduto() {
            const userId = document.getElementById('userId').value;
            const categoria = document.getElementById('selectCategoria').value;
            const nome = document.getElementById('nomeProduto').value;
            const qtdAtual = document.getElementById('qtdAtual').value;
            const estoqueMin = document.getElementById('estoqueMin').value;

            if(!categoria || !nome) return mostrarAviso("Selecione a categoria e digite o nome!", "red");

            const res = await fetch(`${urlBase}/itens`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-usuario-id': userId },
                body: JSON.stringify({ nome, categoria, quantidadeAtual: qtdAtual, estoqueMinimo: estoqueMin })
            });
            const dados = await res.json();

            if(res.ok) {
                document.getElementById('nomeProduto').value = '';
                mostrarAviso("Produto cadastrado com sucesso!", "green");
                carregarProdutos(); // Atualiza a lista
            } else {
                mostrarAviso(dados.erro, "red");
            }
        }

        async function deletarProduto(id) {
            if(!confirm("Tem certeza que deseja excluir este produto do sistema?")) return;
            const userId = document.getElementById('userId').value;
            await fetch(`${urlBase}/itens/${id}`, { method: 'DELETE', headers: { 'x-usuario-id': userId } });
            mostrarAviso("Produto deletado.", "green");
            carregarProdutos();
        }

        // ==========================
        // UI - MENSAGENS FLUTUANTES
        // ==========================
        function mostrarAviso(texto, cor) {
            const div = document.getElementById('mensagem');
            div.innerHTML = texto;
            div.style.display = 'block';
            if(cor === "red") { div.style.backgroundColor = "#ffebee"; div.style.color = "#c62828"; }
            if(cor === "green") { div.style.backgroundColor = "#e8f5e9"; div.style.color = "#2e7d32"; }
            setTimeout(() => div.style.display = 'none', 3000); // Some depois de 3 segundos
        }
    </script>
</body>
</html>
